GEMINI_API_KEY = ""
GEMINI_DAILY_TOKEN_LIMIT = "100000"

[[d1_databases]]
binding = "DB"
database_name = "travelplan"
database_id = "4667570e-324a-44d6-879b-27ee3888d1fc"

